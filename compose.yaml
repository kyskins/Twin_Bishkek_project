services:
  app:
    build: .
    restart: unless-stopped
    user: "${TWINGIS_UID:-1000}:${TWINGIS_GID:-1000}"
    environment:
      TWINGIS_HOST: "0.0.0.0"
      TWINGIS_PORT: "8765"
      TWINGIS_DATA_DIR: "/app/data"
      TWINGIS_MAPGL_KEY: "${TWINGIS_MAPGL_KEY:-}"
      TZ: "Asia/Bishkek"
    volumes:
      - ./data:/app/data
    expose:
      - "8765"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8765/api/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      TWINGIS_DOMAIN: "${TWINGIS_DOMAIN:?Set TWINGIS_DOMAIN in .env}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
